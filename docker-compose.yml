services:
  api:
    image: node:22-bookworm
    working_dir: /app
    command: sh -c "npm ci && DB_PATH=/data/pratham-demo.db npm run server"
    ports: ["5174:5174"]
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - pratham_data:/data
  web:
    image: node:22-bookworm
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    depends_on: [api]
volumes:
  api_node_modules:
  web_node_modules:
  pratham_data:
